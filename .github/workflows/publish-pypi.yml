name: Publish to PyPI

# Trusted publishing via OIDC — no API tokens stored in repo secrets.
#
# ONE-TIME MANUAL SETUP REQUIRED before this workflow can succeed:
#   (a) Configure a PyPI trusted publisher for this repository pointing at
#       this workflow file (publish-pypi.yml) and the `pypi` environment.
#       See: https://docs.pypi.org/trusted-publishers/
#   (b) In GitHub repo settings, create an environment named `pypi`
#       (Settings -> Environments -> New environment). Optionally add
#       protection rules (required reviewers, branch/tag restriction).
# Without both of the above in place, the publish step will fail on first run.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
