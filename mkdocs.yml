site_name: FusionFlow
site_description: A Temporal Specification Language for reproducible ML experimentation
site_url: https://Dinesh0401.github.io/fusionflow/
repo_url: https://github.com/Dinesh0401/fusionflow
repo_name: Dinesh0401/fusionflow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - IR Specification (v0.4): ir-spec-v0.4.md
  - Backends: backends.md
  - Design:
      - Visualize Design: visualize-design.md
      - Research Paper Outline: paper-outline.md
